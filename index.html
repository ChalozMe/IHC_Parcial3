<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA · Inglés asistido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app">

        <!-- ============ HEADER ============ -->
        <header class="app-header">
            <button class="chats-toggle" data-action="toggle-history" aria-controls="history-drawer" aria-label="Chats recientes">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-8 8H6l-3 2V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg>
                <span>Chats</span>
            </button>
            <button class="icon-btn" data-action="open-settings" aria-label="Temas y configuración general" title="Configuración">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            </button>
            <button class="brand-lockup" data-action="go-home" aria-label="Lingua IA: ir al inicio">
                <img src="images/lingua-ia-logo.png" alt="">
            </button>
            <span class="header-divider" aria-hidden="true"></span>

            <nav class="mode-nav" id="mode-nav" aria-label="Tareas: comprender, producir y revisar">
                <button class="mode-pill" data-action="set-mode" data-mode="lessons">Comprender</button>
                <button class="mode-pill is-active" data-action="set-mode" data-mode="writing" aria-current="true">Producir</button>
                <button class="mode-pill" data-action="set-mode" data-mode="errors">Revisar</button>
            </nav>

            <div class="header-spacer"></div>

            <span class="demo-badge"><span class="demo-dot"></span>Demo mocking</span>

            <button class="suggestion-btn" id="suggestions-btn" data-action="toggle-suggestions" aria-expanded="false" aria-controls="suggestions-popover">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>
                <span>Ayuda para este paso</span>
            </button>

            <div class="popover" id="suggestions-popover" hidden></div>
        </header>

        <!-- ============ INICIO ============ -->
        <section class="home" id="home" aria-labelledby="home-title"></section>

        <!-- ============ WORKSPACE ============ -->
        <div class="workspace">
            <nav class="chat-rail" id="chat-rail" aria-label="Navegación de chats"></nav>
            <main class="chat-column">
                <div class="stagebar" id="stagebar"></div>
                <div class="goal-strip" id="goal-strip"></div>
                <div class="branch-ribbon" id="branch-ribbon" hidden></div>

                <div class="chat-scroll" id="chat-scroll">
                    <div class="chat-messages" id="chat-messages"></div>
                </div>

                <div class="side-query" id="side-query" hidden></div>

                <div class="composer">
                    <form class="composer-box" id="chat-form">
                        <label class="sr-only" for="chat-input">Escribe tu mensaje</label>
                        <textarea id="chat-input" rows="1" placeholder="Pregunta algo sobre tu texto o escribe otra frase…"></textarea>
                        <button type="submit" class="round-btn primary" id="send-btn" aria-label="Enviar mensaje" title="Enviar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                        </button>
                    </form>
                    <p class="composer-hint">La IA puede equivocarse: revisa sus sugerencias.</p>
                </div>
            </main>

            <aside class="side-panel" id="side-panel" aria-label="Panel de apoyo">
                <button type="button" class="sheet-close" data-action="close-sheet">Cerrar panel de apoyo</button>
                <div class="aside-tabs" id="aside-tabs" role="tablist"></div>
                <div class="aside-content" id="aside-content"></div>
                <div class="aside-footer" id="aside-footer"></div>
            </aside>
        </div>
    </div>

    <!-- Overlays -->
    <div class="history-overlay" id="history-overlay" data-action="close-history" hidden></div>
    <aside class="history-drawer" id="history-drawer" hidden aria-label="Chats recientes organizados por tarea"></aside>
    <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal"></div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="sheet-overlay" id="sheet-overlay" data-action="close-sheet"></div>
    <div class="sr-only" id="live-region" aria-live="polite"></div>

    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/exercises.js"></script>
    <script src="js/state.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/corrections.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/checker.js"></script>
    <script src="js/glossary.js"></script>
    <script src="js/reading.js"></script>
    <script src="js/review.js"></script>
    <script src="js/errors.js"></script>
    <script src="js/vocab.js"></script>
    <script src="js/writing.js"></script>
    <script src="js/intent.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
